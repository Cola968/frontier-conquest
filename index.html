let c=document.querySelector('canvas'),g=c.getContext('2d'),W=110,H=72,N=W*H,land=new Uint8Array(N),owner=new Int8Array(N),army=[],area=[],scale=7,ox=0,oy=0,active=false,previous=performance.now(),clock=0,ptr=null,drag=false;const colors=['#51d4aa','#e88276','#eac46d','#92a2f1','#b583e0','#7bcbd8','#9acb72','#ec9fc8'],$=x=>document.getElementById(x),index=(x,y)=>y*W+x,near=i=>[i%W?i-1:-1,i%W<W-1?i+1:-1,i>=W?i-W:-1,i<N-W?i+W:-1].filter(j=>j>=0);function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();function take(i,p){if(owner[i]>=0)area[owner[i]]--;owner[i]=p;area[p]++}function setup(){owner.fill(-2);let available=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let f=Math.max(1-((x/W-.31)/.32)**2-((y/H-.38)/.34)**2,1-((x/W-.70)/.29)**2-((y/H-.57)/.35)**2,1-((x/W-.50)/.19)**2-((y/H-.83)/.2)**2);if(f+.12*Math.sin(x*.27+y*.15)+.09*Math.cos(y*.3-x*.16)>0){owner[index(x,y)]=-1;available.push(index(x,y))}}army=Array(8).fill(380);area=Array(8).fill(0);let starts=[];for(let p=0;p<8;p++){let list=available.filter(i=>starts.every(j=>Math.hypot(i%W-j%W,(i/W|0)-(j/W|0))>12));if(!list.length)break;let s=list[Math.random()*list.length|0];starts.push(s);take(s,p);near(s).forEach(j=>{if(owner[j]===-1)take(j,p)})}scale=Math.max(4,Math.min(innerWidth/W,innerHeight/H)*1.5);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;active=false;$('modal').style.display='grid';update()}function targets(p){let a=[],seen=new Set;for(let i=0;i<N;i++)if(owner[i]===p)for(let j of near(i))if(owner[j]!==p&&owner[j]!==-2&&!seen.has(j)){seen.add(j);a.push(j)}return a}function hit(p,i,r){if(owner[i]===-2||owner[i]===p||!near(i).some(j=>owner[j]===p))return;let budget=army[p]*r|0;army[p]-=budget;let q=[i],seen=new Set,count=0;while(q.length&&budget>0&&count<130){let j=q.shift();if(seen.has(j)||owner[j]===p||owner[j]===-2)continue;seen.add(j);if(!near(j).some(k=>owner[k]===p))continue;let ri
